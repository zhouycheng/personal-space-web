services:
  justinspace:
    image: ${JUSTINSPACE_IMAGE:-justinspace:local}
    build:
      context: .
    container_name: justinspace
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - JUSTIN_OS_DESKTOP_DIR=/app/dist/client/os-desktop
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
