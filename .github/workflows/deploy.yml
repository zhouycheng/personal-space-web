name: CI and deploy JustinSpace

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare the validated journal runtime manifest
        run: node scripts/journal-content.mjs --strict
      - run: npm run check:boundaries
      - run: npm run check:types
      - run: npm run test:unit
      - run: npm run build

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: justinspace-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish immutable image
        id: publish
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_tag="ghcr.io/zhouycheng/personal-space-web:${GITHUB_SHA}"
          cache_ref="ghcr.io/zhouycheng/personal-space-web:buildcache"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name justinspace-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          cache_from=()
          if docker buildx imagetools inspect --raw "$cache_ref" >/dev/null 2>&1; then
            cache_from+=(--cache-from "type=registry,ref=$cache_ref")
          fi
          docker buildx build --pull --push \
            --tag "$image_tag" \
            "${cache_from[@]}" \
            --cache-to "type=registry,ref=$cache_ref,mode=min,ignore-error=true" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image-metadata.json")"
          docker pull "ghcr.io/zhouycheng/personal-space-web@${digest}"
          docker logout ghcr.io >/dev/null
          echo "image=ghcr.io/zhouycheng/personal-space-web@${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: justinspace-production
      cancel-in-progress: false
    permissions:
      id-token: write
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      TAILSCALE_SERVER: ${{ secrets.TAILSCALE_SERVER }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Check deployment settings
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          case "$PRODUCTION_URL" in
            https://*) ;;
            *) echo 'PRODUCTION_URL must use HTTPS' >&2; exit 1 ;;
          esac
          test -n "$IMAGE"
          test -n "$TAILSCALE_SERVER"
          test -n "$PRODUCTION_URL"
          test -n "$TS_OAUTH_CLIENT_ID"
          test -n "$TS_AUDIENCE"
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Deploy through Tailscale SSH
        id: deploy
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' "$IMAGE" "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | tailscale ssh "deploy@${TAILSCALE_SERVER}" \
            'sudo -n /usr/local/sbin/deployctl deploy justinspace'
      - name: Check the public site
        id: smoke
        run: |
          set -euo pipefail
          base_url="${PRODUCTION_URL%/}"
          health="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${base_url}/api/health")"
          jq -e '.ok == true and .desktopEntries > 0 and .canvas == true and .journal.ok == true' \
            <<< "$health" >/dev/null
          for route in / /home /works /canvas /os; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 10 --retry-all-errors --retry-delay 3 \
              "${base_url}${route}" >/dev/null
          done
      - name: Roll back after a failed public check
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | tailscale ssh "deploy@${TAILSCALE_SERVER}" \
            'sudo -n /usr/local/sbin/deployctl rollback justinspace'
      - name: Verify the restored public site
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: |
          set -euo pipefail
          base_url="${PRODUCTION_URL%/}"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "${base_url}/api/health" | jq -e '.ok == true' >/dev/null
          for route in / /home /works /canvas /os; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "${base_url}${route}" >/dev/null
          done
